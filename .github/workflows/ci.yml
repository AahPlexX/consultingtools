name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish pending verification status
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"pending\",\"target_url\":\"$STATUS_URL\",\"description\":\"npm run verify is running\",\"context\":\"ci/verify\"}"

      - name: Install pinned dependencies and verify types, tests, and build
        id: verify
        continue-on-error: true
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run verify

      - name: Publish final verification status
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          STATUS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            state="success"
            description="npm run verify passed"
          else
            state="failure"
            description="npm run verify failed"
          fi

          curl --fail-with-body --silent --show-error -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"target_url\":\"$STATUS_URL\",\"description\":\"$description\",\"context\":\"ci/verify\"}"

      - name: Fail CI when verification failed
        if: steps.verify.outcome != 'success'
        run: exit 1
